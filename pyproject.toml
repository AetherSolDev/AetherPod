# Path: pyproject.toml
# Purpose: Project metadata and entry point for pip-installable aetherpod command.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherpod"
version = "0.4.4"
description = "Terminal Podcast Manager — subscribe, browse, and play podcasts from your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["podcast", "tui", "terminal", "textual", "mpv", "rss", "audio", "podcasts"]
classifiers = [
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "feedparser>=6.0,<7.0",
    "textual>=0.41,<2.0",
    "aiohttp>=3.9,<4.0",
]

[project.urls]
Homepage = "https://github.com/AetherSolDev/AetherPod"
Source = "https://github.com/AetherSolDev/AetherPod"
Issues = "https://github.com/AetherSolDev/AetherPod/issues"
Releases = "https://github.com/AetherSolDev/AetherPod/releases"

[project.scripts]
aetherpod = "aetherpod.cli:main"

[tool.setuptools.packages.find]
include = ["aetherpod*"]

# Path: pyproject.toml
# Purpose: Project metadata and entry point for pip-installable aetherpod command.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherpod"
version = "0.2.1"
description = "Terminal podcast manager for Arch Linux"
requires-python = ">=3.9"
dependencies = [
    "feedparser>=6.0,<7.0",
    "textual>=0.41,<2.0",
    "aiohttp>=3.9,<4.0",
]

[project.scripts]
aetherpod = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

# Created: 2026-08-01
# Last Edited: 2026-08-01 03:58 CT (America/Chicago)
# Path: .github/workflows/build.yml
# Purpose: Build single-file executables for Linux, macOS, and Windows via PyInstaller; upload artifacts on every push and attach to GitHub Releases on version tags.

name: Build Executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: aetherpod-linux
          - os: macos-latest
            binary: aetherpod-macos
          - os: windows-latest
            binary: aetherpod-windows.exe

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --name ${{ matrix.binary }} --collect-submodules aetherpod aetherpod/cli.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: dist/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          name: AetherPod ${{ github.ref_name }}
          generate_release_notes: true
